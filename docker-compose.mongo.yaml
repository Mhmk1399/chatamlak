# Local development only: run Node/Vite on the host, not in another container.
# This port is deliberately bound to loopback; use authenticated Atlas/a secured
# replica set for deployment. This compose file does not load application .env.
services:
  mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "ouj-rs", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - ouj-mongo-dev:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval 'try { rs.status().ok } catch (e) {
          rs.initiate({_id:"ouj-rs",members:[{_id:0,host:"localhost:27017"}]}).ok }'
      interval: 5s
      timeout: 10s
      retries: 20

volumes:
  ouj-mongo-dev:
