services:
  ouj-chat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ouj-chat
    restart: unless-stopped
    expose:
      - "${SERVER_PORT:-5174}"
    env_file:
      - path: ${OUJ_CHAT_ENV_FILE:-.env}
        required: false
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:-production}
      SERVER_PORT: ${SERVER_PORT:-5174}
      BIND_ADDRESS: "0.0.0.0"
      # This service is reachable only through the compose-managed Nginx proxy.
      WS_TRUST_PROXY: ${WS_TRUST_PROXY:-true}
      DB_CLIENT: mongodb
      MONGODB_URI: ${MONGODB_URI:?Set your MongoDB replica-set or Atlas URI in the selected environment file}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-ouj_chat}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      WORKER_PORT: ${WORKER_PORT:-8080}
      STORAGE_PROCESSING_MODE: ${STORAGE_PROCESSING_MODE:-auto}
      WORKER_URL: ${WORKER_URL:-${MEDIA_WORKER_URL:-}}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      WORKER_REQUIRE_SIGNED_REQUESTS: ${WORKER_REQUIRE_SIGNED_REQUESTS:-true}
      WORKER_AUTH_MAX_SKEW_MS: ${WORKER_AUTH_MAX_SKEW_MS:-300000}
      WORKER_AUTH_REPLAY_CACHE_SIZE: ${WORKER_AUTH_REPLAY_CACHE_SIZE:-10000}
    volumes:
      - ouj-chat-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-443}:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/cert.pem:/etc/nginx/certs/cert.pem:ro
      - ./certs/key.pem:/etc/nginx/certs/key.pem:ro
    # Wait for the app to pass its healthcheck before nginx starts accepting traffic.
    # This avoids 502s during database connection and index initialization.
    depends_on:
      ouj-chat:
        condition: service_healthy

volumes:
  ouj-chat-data:

