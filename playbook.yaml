---
# Ouj Chat for the Doprax App Market (installMethod: repo_playbook).
#
# What it does on the target VM (Ubuntu, hosts: all, become: yes):
#   1. Installs Docker Engine + compose plugin, git and openssl.
#   2. Clones the configured Ouj Chat repository into /root/ouj-chat.
#   3. Generates a self-signed TLS cert (certs/) if none exists, so the
#      bundled nginx (443 -> ouj-chat:5174) comes up without manual steps.
#      Replace certs/cert.pem + certs/key.pem with real certs for production.
#   4. Writes a minimal .env (only if missing) and starts the stack.
#   5. Waits for 443 and verifies https://127.0.0.1/api/health.
#
# Doprax injects configurationVariables as extra vars. This playbook uses:
#   - external_domain (Domain): public hostname, used for APP_PUBLIC_URL,
#     the self-signed cert CN and the printed access URL. Optional.
#
# Local test (Ubuntu VM, Ansible installed):
#   ansible-playbook -i <host>, -u root playbook.yaml
#   curl -sk https://<host>/api/health
- name: Deploy Ouj Chat chat platform with Docker Compose
  hosts: all
  become: true
  vars:
    ouj_chat_repo: "{{ ouj_chat_repository | default('https://github.com/Mhmk1399/chatamlak.git', true) }}"
    # Override ouj_chat_ref to deploy a tested tag or commit instead of main.
    ouj_chat_version: "{{ ouj_chat_ref | default('main', true) }}"
    ouj_chat_src: "/root/ouj-chat"
    ouj_chat_domain: "{{ external_domain | default('') }}"
    ouj_chat_http_port: 80
    ouj_chat_https_port: 443
  tasks:
    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg-agent
          - software-properties-common
          - git
          - openssl
          - python3
        update_cache: yes

    - name: Add Docker's official GPG key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
        state: present

    - name: Install Docker Engine
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-compose-plugin
          - docker-buildx-plugin
        update_cache: yes
        state: present

    - name: Ensure Docker service is started
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: yes

    - name: Require the Ouj Chat MongoDB URI
      ansible.builtin.assert:
        that:
          - mongodb_uri | default('', true) | length > 0
        fail_msg: >-
          Set the private mongodb_uri extra variable to a dedicated MongoDB
          replica-set or Atlas URI before deploying Ouj Chat.

    - name: Clone Ouj Chat at the requested version
      ansible.builtin.git:
        repo: "{{ ouj_chat_repo }}"
        dest: "{{ ouj_chat_src }}"
        version: "{{ ouj_chat_version }}"
        update: yes

    - name: Create certs directory
      ansible.builtin.file:
        path: "{{ ouj_chat_src }}/certs"
        state: directory
        mode: "0755"

    - name: Generate self-signed TLS certificate
      ansible.builtin.command:
        cmd: >
          openssl req -x509 -nodes -days 825 -newkey rsa:2048
          -keyout {{ ouj_chat_src }}/certs/key.pem
          -out {{ ouj_chat_src }}/certs/cert.pem
          -subj "/CN={{ ouj_chat_domain if (ouj_chat_domain | length > 0) else 'localhost' }}"
          -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
        creates: "{{ ouj_chat_src }}/certs/cert.pem"

    - name: Write minimal .env
      ansible.builtin.copy:
        dest: "{{ ouj_chat_src }}/.env"
        force: no
        mode: "0600"
        content: |
          APP_ENV=production
          SERVER_PORT=5174
          BIND_ADDRESS=0.0.0.0
          DB_CLIENT=mongodb
          MONGODB_URI='{{ mongodb_uri }}'
          MONGODB_DATABASE={{ mongodb_database | default('ouj_chat', true) }}
          APP_PUBLIC_URL={{ 'https://' + ouj_chat_domain if (ouj_chat_domain | length > 0) else '' }}

    - name: Pull images and start the stack
      ansible.builtin.shell:
        cmd: docker compose up -d
        chdir: "{{ ouj_chat_src }}"
      register: ouj_chat_compose
      changed_when: "'Started' in ouj_chat_compose.stdout or 'Creating' in ouj_chat_compose.stdout"

    - name: Wait for HTTPS port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ ouj_chat_https_port }}"
        delay: 10
        timeout: 180
      register: ouj_chat_port_wait
      failed_when: false

    - name: Wait for Ouj Chat health endpoint
      ansible.builtin.uri:
        url: "https://127.0.0.1/api/health"
        validate_certs: no
        status_code: 200
      register: ouj_chat_health
      until: ouj_chat_health.status == 200
      retries: 12
      delay: 10
      failed_when: false

    - name: Build deployment summary
      ansible.builtin.set_fact:
        ouj_chat_success: "{{ ouj_chat_port_wait is succeeded and ouj_chat_health.status is defined and ouj_chat_health.status == 200 }}"
        ouj_chat_access_url: "{{ 'https://' + ouj_chat_domain if (ouj_chat_domain | length > 0) else 'https://' + (ansible_default_ipv4.address | default('SERVER_IP')) }}"

    - name: Print deployment summary
      ansible.builtin.debug:
        msg:
          - "Ouj Chat {{ ouj_chat_version }} deployment {{ 'succeeded' if ouj_chat_success else ('may be incomplete — check logs in ' + ouj_chat_src) }}."
          - "Access URL: {{ ouj_chat_access_url }} (self-signed cert until you replace certs/cert.pem + certs/key.pem)."
          - "First steps: create the owner account, then set SIGN_UP=false in {{ ouj_chat_src }}/.env if the instance is public."
          - "Notes: MongoDB data is external to this stack; the container mounts /var/run/docker.sock for the admin panel's service controls."
